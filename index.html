<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rasid ASMaaS Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{base:'#0B1120',panel:'#111827',edge:'#1F2A3C'}}}}</script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* VOICE: calm, clinical SOC console — facts first, no theatre
   IDEA: a radar watchtower scanning the perimeter of an Omani enterprise
   PICTURE: risk gauge + attack-path graph as the hero visuals
   COLOUR and TYPE: #0B1120 slate, #111827 cards, sky→teal→emerald accents; Inter + Cairo
   LAYOUT: mobile-first single column, sticky header, bottom navigation, drawer + modal */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0B1120;color:#E2E8F0;font-family:Inter,Cairo,system-ui,sans-serif;overflow-x:clip}
html[lang=ar] body{font-family:Cairo,Inter,system-ui,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
bdi{unicode-bidi:isolate}
.card{background:#111827;border:1px solid #1F2A3C;border-radius:16px}
.grad-text{background:linear-gradient(90deg,#0EA5E9,#14B8A6,#10B981);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-btn{background:linear-gradient(90deg,#0EA5E9,#14B8A6,#10B981);color:#04121c}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #1F2A3C;background:#0F172A;color:#94A3B8;font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.chip[aria-pressed=true]{background:#0EA5E91f;border-color:#0EA5E9;color:#E0F2FE}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.seg button{flex:1;min-height:44px;font-size:13px;font-weight:600;color:#94A3B8;border-radius:10px}
.seg button[aria-pressed=true]{color:#fff}
.navbtn{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:#64748B}
.navbtn[aria-current=page]{color:#38BDF8}
.navbtn[aria-current=page] svg{filter:drop-shadow(0 0 6px #0EA5E9aa)}
button:focus-visible,input:focus-visible,summary:focus-visible,.node:focus-visible{outline:2px solid #0EA5E9;outline-offset:2px}
.view{display:none}.view.active{display:block}
.sweep{transform-origin:32px 32px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:7 6;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
.pulse{animation:pulse 1s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 4px #10B98155;border-color:#10B981}}
.drawer{transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
.dot{width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 0 0 #10B98188;animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px #10B98100}100%{box-shadow:0 0 0 0 #10B98100}}
.stage{padding:6px 10px;border-radius:999px;border:1px solid #1F2A3C;color:#64748B;font-size:12px;font-weight:700}
.stage.active{border-color:#0EA5E9;color:#7DD3FC;background:#0EA5E914}
.stage.done{border-color:#10B98166;color:#34D399}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(180deg)}
.scrollx{overflow-x:auto;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}
#term .ln{white-space:pre-wrap;word-break:break-word}
@media (prefers-reduced-motion:reduce){.sweep,.flow,.pulse,.dot{animation:none}.drawer{transition:none}}
/* report table on phones */
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid #E2E8F0}.stack td{display:flow-root;border:0!important;padding:3px 0!important;padding-inline-start:6.5em!important}.stack td::before{content:attr(data-l);float:inline-start;width:6em;margin-inline-start:-6.5em;color:#64748B;font-weight:600}}
@media print{
  @page{margin:12mm}
  html,body{background:#fff!important}
  header,main,nav,#drawer,#scrim,#toast,.no-print{display:none!important}
  #report{position:static!important;display:block!important;background:none!important;overflow:visible!important;padding:0!important}
  #reportSheet{max-width:none!important;margin:0!important;border-radius:0!important;box-shadow:none!important;padding:0!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="sticky top-0 z-30 bg-base/90 backdrop-blur border-b border-edge" style="padding-top:env(safe-area-inset-top)">
  <div class="max-w-5xl mx-auto px-4 pt-3 pb-2 flex items-center gap-3">
    <div id="logoHead" class="w-11 h-11 shrink-0"></div>
    <div class="leading-tight">
      <div class="text-[17px] font-extrabold tracking-wide text-white">RASID <span class="text-slate-600">|</span> <span style="font-family:Cairo">راصد</span></div>
      <div class="text-[12px] text-slate-400" data-i18n="tagline">External Attack Surface Management</div>
    </div>
    <div class="ms-auto flex items-center gap-2">
      <button id="scanHead" class="w-11 h-11 rounded-xl border border-edge bg-panel grid place-items-center text-teal-300" aria-label="Run scan"><i data-lucide="radar" class="w-5 h-5"></i></button>
      <div class="flex rounded-xl border border-edge bg-panel p-1" role="group" aria-label="Language">
        <button data-lang="en" class="langbtn h-9 px-3 rounded-lg text-[13px] font-bold">EN</button>
        <button data-lang="ar" class="langbtn h-9 px-3 rounded-lg text-[13px] font-bold" style="font-family:Cairo">عربي</button>
      </div>
    </div>
  </div>
  <div class="max-w-5xl mx-auto px-4 pb-3">
    <span class="inline-flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-[12px] font-semibold text-emerald-300">
      <span class="dot"></span><span data-i18n="demoEnv">Demo Environment</span> • <bdi class="mono">oman-logistics-demo.om</bdi>
    </span>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 pt-5" style="padding-bottom:calc(96px + env(safe-area-inset-bottom))">

  <!-- 1. OVERVIEW -->
  <section id="v-overview" class="view active">
    <h1 id="headline" class="text-[26px] sm:text-[34px] font-extrabold leading-[1.1] text-white" style="text-wrap:balance"></h1>
    <p id="headSub" class="mt-2 text-[15px] text-slate-400"></p>
    <p class="mt-1 text-[12px] text-slate-500" data-i18n="lastScan"></p>

    <div class="mt-5 grid gap-3 md:grid-cols-5">
      <div class="card p-4 md:col-span-2 flex flex-col items-center">
        <div class="self-start text-[13px] font-semibold text-slate-400" data-i18n="riskTitle"></div>
        <svg viewBox="0 0 200 124" class="w-full max-w-[280px] mt-2" aria-hidden="true">
          <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#10B981"/><stop offset=".55" stop-color="#F59E0B"/><stop offset="1" stop-color="#F43F5E"/></linearGradient></defs>
          <path d="M20 104 A80 80 0 0 1 180 104" fill="none" stroke="#1F2A3C" stroke-width="16" stroke-linecap="round"/>
          <path id="gVal" d="M20 104 A80 80 0 0 1 180 104" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 252" style="transition:stroke-dasharray .8s"/>
          <text id="gNum" x="100" y="92" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">74</text>
          <text x="100" y="112" text-anchor="middle" font-size="12" fill="#64748B">/ 100</text>
        </svg>
        <div id="gLvl" class="text-[15px] font-bold -mt-1"></div>
      </div>
      <div class="md:col-span-3 grid grid-cols-2 gap-3">
        <div class="card p-4 kpi"><div class="flex items-center gap-2 text-[13px] text-slate-400"><i data-lucide="globe" class="w-4 h-4 text-sky-400"></i><span data-i18n="kAssets"></span></div><div id="kA" class="mt-2 text-[32px] font-extrabold text-white">28</div></div>
        <div class="card p-4 kpi"><div class="flex items-center gap-2 text-[13px] text-slate-400"><i data-lucide="plug" class="w-4 h-4 text-teal-400"></i><span data-i18n="kServices"></span></div><div id="kS" class="mt-2 text-[32px] font-extrabold text-white">14</div></div>
        <div class="card p-4 kpi"><div class="flex items-center gap-2 text-[13px] text-slate-400"><i data-lucide="shield-alert" class="w-4 h-4 text-rose-400"></i><span data-i18n="kCH"></span></div><div class="mt-2 text-[32px] font-extrabold"><span id="kC" class="text-rose-400">2</span><span class="text-slate-600 mx-1">·</span><span id="kH" class="text-orange-400">4</span></div></div>
        <div class="card p-4 kpi"><div class="flex items-center gap-2 text-[13px] text-slate-400"><i data-lucide="bell" class="w-4 h-4 text-amber-400"></i><span data-i18n="kAlerts"></span></div><div id="kL" class="mt-2 text-[32px] font-extrabold text-white">3</div></div>
      </div>
    </div>

    <button id="scanBtn" class="grad-btn mt-4 w-full min-h-[56px] rounded-2xl font-extrabold text-[16px] flex items-center justify-center gap-2 shadow-lg shadow-teal-500/20">
      <i data-lucide="radar" class="w-5 h-5"></i><span id="scanBtnTxt" data-i18n="runScan"></span>
    </button>

    <div class="mt-4 grid gap-3 md:grid-cols-2">
      <div class="card p-4">
        <div class="flex items-baseline justify-between gap-2"><h2 class="font-bold text-white" data-i18n="sevTitle"></h2><span id="sevSub" class="text-[12px] text-slate-500"></span></div>
        <div id="sevBar" class="mt-4 flex h-4 rounded-full overflow-hidden bg-edge"></div>
        <div id="sevLegend" class="mt-4 grid grid-cols-2 gap-2"></div>
      </div>
      <div class="card p-4">
        <h2 class="font-bold text-white" data-i18n="alertsTitle"></h2>
        <ul id="alerts" class="mt-1"></ul>
      </div>
    </div>
  </section>

  <!-- 2. ATTACK PATH -->
  <section id="v-path" class="view">
    <h1 class="text-[24px] sm:text-[32px] font-extrabold leading-[1.1] text-white" style="text-wrap:balance" data-i18n="pathTitle"></h1>
    <p class="mt-2 text-[15px] text-slate-400" data-i18n="pathSub"></p>
    <div class="mt-4 flex flex-wrap items-center gap-3">
      <button id="hlToggle" role="switch" aria-checked="true" class="flex items-center gap-3 min-h-[44px] rounded-xl border border-edge bg-panel px-3">
        <span id="hlTrack" class="relative w-11 h-6 rounded-full bg-rose-500 transition"><span id="hlKnob" class="absolute top-0.5 start-0.5 w-5 h-5 rounded-full bg-white transition-transform"></span></span>
        <span class="text-[14px] font-semibold" data-i18n="highlight"></span>
      </button>
      <span class="flex items-center gap-1.5 text-[12px] text-slate-400"><span class="w-4 h-0.5 bg-rose-500"></span><span data-i18n="legendCrit"></span></span>
      <span class="flex items-center gap-1.5 text-[12px] text-slate-400"><span class="w-4 h-0.5 bg-slate-500"></span><span data-i18n="legendOther"></span></span>
    </div>
    <div class="mt-4 grid gap-3 md:grid-cols-5">
      <div class="card p-2 md:col-span-3"><svg id="graph" viewBox="0 0 360 400" class="w-full max-w-[560px] mx-auto block" role="img" aria-label="Attack path graph"></svg></div>
      <div class="md:col-span-2"><p class="text-[12px] text-slate-500 mb-2 flex items-center gap-1.5"><i data-lucide="pointer" class="w-3.5 h-3.5"></i><span data-i18n="tapHint"></span></p><div id="nodeDetail" class="card p-4"></div></div>
    </div>
  </section>

  <!-- 3. ASSETS -->
  <section id="v-assets" class="view">
    <h1 class="text-[24px] sm:text-[32px] font-extrabold text-white" data-i18n="assetsTitle"></h1>
    <label class="mt-4 flex items-center gap-2 rounded-xl border border-edge bg-panel px-3 min-h-[48px] focus-within:border-sky-500">
      <i data-lucide="search" class="w-4 h-4 text-slate-500 shrink-0"></i>
      <input id="q" type="search" class="w-full bg-transparent outline-none text-[16px] placeholder:text-slate-500" data-i18n-ph="searchPh" autocomplete="off">
    </label>
    <div id="assetChips" class="scrollx mt-3 flex gap-2 pb-1"></div>
    <p id="assetCount" class="mt-3 text-[13px] text-slate-500"></p>
    <div id="assetList" class="mt-2 grid gap-3 sm:grid-cols-2"></div>
  </section>

  <!-- 4. FINDINGS -->
  <section id="v-findings" class="view">
    <h1 class="text-[24px] sm:text-[32px] font-extrabold text-white" data-i18n="findTitle"></h1>
    <p class="mt-2 text-[15px] text-slate-400" data-i18n="findSub"></p>
    <div id="sevChips" class="scrollx mt-4 flex gap-2 pb-1"></div>
    <p id="findCount" class="mt-3 text-[13px] text-slate-500"></p>
    <div id="findList" class="mt-2 grid gap-3"></div>
  </section>

  <p class="mt-8 text-center text-[12px] text-slate-600" data-i18n="footer"></p>
</main>

<!-- Bottom navigation -->
<nav class="fixed bottom-0 inset-x-0 z-30 bg-panel/95 backdrop-blur border-t border-edge" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="max-w-3xl mx-auto flex">
    <button class="navbtn" data-view="overview" aria-current="page"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span data-i18n="nav_overview"></span></button>
    <button class="navbtn" data-view="path"><i data-lucide="workflow" class="w-5 h-5"></i><span data-i18n="nav_path"></span></button>
    <button class="navbtn" data-view="assets"><i data-lucide="server" class="w-5 h-5"></i><span data-i18n="nav_assets"></span></button>
    <button class="navbtn" data-view="findings"><i data-lucide="shield-alert" class="w-5 h-5"></i><span data-i18n="nav_findings"></span></button>
    <button class="navbtn" data-view="report"><i data-lucide="file-text" class="w-5 h-5"></i><span data-i18n="nav_report"></span></button>
  </div>
</nav>

<!-- Scan drawer -->
<div id="scrim" class="fixed inset-0 z-40 bg-black/60 hidden"></div>
<section id="drawer" class="drawer fixed inset-x-0 bottom-0 z-50" role="dialog" aria-modal="true" aria-labelledby="drawerH">
  <div class="max-w-3xl mx-auto bg-[#070C16] border border-edge rounded-t-2xl shadow-2xl" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="w-10 h-1.5 rounded-full bg-slate-700 mx-auto mt-2"></div>
    <div class="flex items-center gap-3 px-4 pt-3">
      <div class="w-9 h-9 rounded-lg bg-teal-500/15 grid place-items-center text-teal-300"><i data-lucide="terminal" class="w-5 h-5"></i></div>
      <div class="min-w-0"><h2 id="drawerH" class="font-bold text-white" data-i18n="drawerTitle"></h2><bdi class="mono text-[12px] text-slate-500">oman-logistics-demo.om</bdi></div>
      <button id="drawerClose" class="ms-auto w-11 h-11 rounded-xl border border-edge grid place-items-center text-slate-400" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="scrollx flex items-center gap-1.5 px-4 mt-3" dir="ltr">
      <span class="stage" data-stage="subfinder">subfinder</span><i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-600 shrink-0"></i>
      <span class="stage" data-stage="dnsx">dnsx</span><i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-600 shrink-0"></i>
      <span class="stage" data-stage="httpx">httpx</span><i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-600 shrink-0"></i>
      <span class="stage" data-stage="nuclei">nuclei</span>
    </div>
    <div class="mx-4 mt-3 h-1.5 rounded-full bg-edge overflow-hidden"><div id="prog" class="h-full grad-btn" style="width:0"></div></div>
    <div id="term" class="mono text-[13px] leading-relaxed h-[44vh] overflow-y-auto px-4 py-3 mt-2 text-slate-300" dir="ltr" aria-live="polite"></div>
    <div class="flex items-center gap-3 px-4 pb-4 pt-2 border-t border-edge">
      <p id="scanResult" class="text-[13px] text-slate-400 flex-1"></p>
      <button id="scanAgain" class="grad-btn min-h-[44px] px-4 rounded-xl font-bold text-[14px] hidden" data-i18n="runAgain"></button>
    </div>
  </div>
</section>

<!-- Executive report -->
<div id="report" class="fixed inset-0 z-50 hidden bg-black/75 overflow-y-auto" role="dialog" aria-modal="true" aria-label="Executive report">
  <div class="no-print sticky top-0 z-10 bg-base/95 backdrop-blur border-b border-edge" style="padding-top:env(safe-area-inset-top)">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-2">
      <button id="repClose" class="w-11 h-11 rounded-xl border border-edge grid place-items-center text-slate-300" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>
      <span class="font-bold text-white" data-i18n="nav_report"></span>
      <button id="printBtn" class="ms-auto grad-btn min-h-[44px] px-4 rounded-xl font-bold text-[14px] flex items-center gap-2"><i data-lucide="printer" class="w-4 h-4"></i><span data-i18n="printBtn"></span></button>
    </div>
    <p id="printNote" class="hidden max-w-3xl mx-auto px-4 pb-3 text-[13px] text-amber-300" data-i18n="printNote"></p>
  </div>
  <article id="reportSheet" class="max-w-3xl mx-auto bg-white text-slate-900 sm:rounded-2xl p-5 sm:p-10 my-0 sm:my-6 shadow-2xl"></article>
</div>

<div id="toast" class="fixed top-4 inset-x-4 z-[60] mx-auto max-w-md rounded-xl border border-emerald-500/40 bg-[#062019] text-emerald-200 px-4 py-3 text-[14px] font-semibold shadow-xl hidden" role="status"></div>

<script>

   <table class="stack mt-2 w-full text-[13px] border-collapse">
    <thead><tr class="text-start text-slate-500 border-b border-slate-200"><th class="text-start py-2 pe-2">${t('repSeverity')}</th><th class="text-start py-2 pe-2">${t('repFinding')}</th><th class="text-start py-2 pe-2">${t('repAsset')}</th><th class="text-end py-2 pe-2">CVSS</th><th class="text-start py-2">${t('repStatus')}</th></tr></thead>
    <tbody>${top.map(f=>`<tr class="border-b border-slate-100 align-top"><td class="py-2 pe-2"><span class="font-bold" style="color:${SEV[f.sev].c}">${t(f.sev)}</span></td><td class="py-2 pe-2 font-semibold text-slate-800">${bidi(L(f.title))}</td><td class="py-2 pe-2 break-all"><bdi class="mono text-[12px]">${f.asset}</bdi></td><td class="py-2 pe-2 text-end font-bold">${f.cvss.toFixed(1)}</td><td class="py-2">${t(STL[f.status])}</td></tr>`).join('')}</tbody>
   </table>
   <h2 class="mt-6 text-[16px] font-bold text-[#0B2A4A]">${t('repActions')}</h2>
   <ol class="mt-2 list-decimal ps-5 space-y-2 text-[14px] text-slate-800">${['act1','act2','act3'].map(k=>`<li>${bidi(t(k))}</li>`).join('')}</ol>
   <p class="mt-8 pt-4 border-t border-slate-200 text-[11px] text-slate-400">${t('footer')}</p>`;
}

/* ---------- scan simulation ---------- */
let scanning=false;
function buildLogs(first){
  const s='staging-api'+D,u='uat-tracking'+D;
  return [
   [0,'$ rasid scan --target oman-logistics-demo.om --profile external','cmd','subfinder'],
   [350,'[subfinder] Enumerating passive sources (crt.sh, DNS datasets, web archives)…','info','subfinder'],
   [1100,`[subfinder] ${first?31:30} candidate subdomains collected`,'info','subfinder'],
   [1700,'[dnsx] Resolving A / AAAA / CNAME records…','info','dnsx'],
   [2500,first?`[dnsx] 29 live hosts · NEW: ${u} → 185.x.x.47`:'[dnsx] 29 live hosts · no new hosts','warn','dnsx'],
   [3200,'[httpx] Probing ports 80, 443, 8080, 8443 on 29 hosts…','info','httpx'],
   [4000,`[httpx] ${u} [200] [Apache/2.4.57] [Index of /exports] [direct origin · no WAF]`,first?'warn':'info','httpx'],
   [4700,'[httpx] TLS: vpn.oman-logistics-demo.om certificate expires in 6 days','warn','httpx'],
   [5400,'[nuclei] Running 4,812 templates (exposures, misconfig, cves, takeovers)…','info','nuclei'],
   [6300,`[nuclei] [medium] directory-listing → https://${u}/exports/${first?'':' (known)'}`,'warn','nuclei'],
   [6900,`[nuclei] [critical] exposed-env-file → https://${s}:8443/.env (known)`,'crit','nuclei'],
   [7500,'[rasid] Correlating with asset inventory and change baseline…','info','nuclei'],
   [8000,first?'[rasid] Done · 1 new exposed asset · 1 new finding · risk 74 → 76':'[rasid] Done · no changes since last scan','ok','done']
  ];
}
const CLS={cmd:'text-sky-300',info:'text-slate-300',warn:'text-amber-300',crit:'text-rose-400 font-semibold',ok:'text-emerald-400 font-semibold'};
const ORDER=['subfinder','dnsx','httpx','nuclei'];
function setStage(st){const i=st==='done'?4:ORDER.indexOf(st);$$('.stage').forEach((e,j)=>{e.classList.toggle('done',j<i);e.classList.toggle('active',j===i)})}
function openDrawer(){$('#scrim').classList.remove('hidden');$('#drawer').classList.add('open')}
function closeDrawer(){$('#scrim').classList.add('hidden');$('#drawer').classList.remove('open')}
function runScan(){
  openDrawer();if(scanning)return;scanning=true;
  const first=!state.scanned,term=$('#term');term.innerHTML='';$('#scanResult').textContent=t('scanning');$('#scanAgain').classList.add('hidden');
  $('#scanBtnTxt').textContent=t('scanning');$('#scanBtn').disabled=true;$('#scanBtn').classList.add('opacity-70');
  setStage('subfinder');
  buildLogs(first).forEach(([ms,txt,cl,st])=>setTimeout(()=>{
    const d=document.createElement('div');d.className='ln '+CLS[cl];
    d.textContent=`[00:${String(Math.floor(ms/1000)).padStart(2,'0')}.${Math.floor(ms%1000/100)}] ${txt}`;
    term.appendChild(d);term.scrollTop=term.scrollHeight;setStage(st)},ms));
  const t0=performance.now();
  const tick=()=>{const p=Math.min(1,(performance.now()-t0)/8000);$('#prog').style.width=p*100+'%';if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);
  setTimeout(()=>finishScan(first),8100);
}
function finishScan(first){
  scanning=false;$('#scanBtn').disabled=false;$('#scanBtn').classList.remove('opacity-70');
  if(first){
    state.scanned=true;state.services++;
    ASSETS.unshift(A('uat-tracking'+D,'sub','185.x.x.47',[80,443],'Apache 2.4.57','direct',54,1));
    FINDINGS.push(F('f12','medium',5.3,'uat-tracking'+D,{en:'No CVE · misconfiguration',ar:'لا يوجد CVE · خطأ إعداد'},'CWE-548',['T1083'],
      {en:'Directory listing exposes /exports',ar:'عرض محتويات المجلد يكشف /exports'},
      {en:'Found in this scan: /exports/ lists shipment CSV files on a UAT host with no WAF.',ar:'رُصد في هذا الفحص: المجلد /exports/ يعرض ملفات شحنات CSV على خادم اختبار دون جدار حماية.'},
      {en:['Disable directory indexing (Options -Indexes).','Remove real data from UAT and restrict the host to VPN.'],ar:['عطّل عرض محتويات المجلدات (Options -Indexes).','احذف البيانات الحقيقية من بيئة الاختبار وقيّد الخادم بالشبكة الافتراضية الخاصة.']}));
    ALERTS.unshift({sev:'medium',text:{en:'New exposed host uat-tracking.oman-logistics-demo.om with directory listing',ar:'رُصد خادم مكشوف جديد uat-tracking.oman-logistics-demo.om مع عرض محتويات المجلد'},time:{en:'Just now',ar:'الآن'}});
  }
  state.lastResult=first?'resNew':'resNone';
  renderAll();
  $('#scanResult').textContent=t(state.lastResult);$('#scanAgain').classList.remove('hidden');
  if(first)$$('.kpi').forEach(k=>{k.classList.remove('pulse');void k.offsetWidth;k.classList.add('pulse')});
  toast(bidi(t(first?'toastNew':'toastNone')));
}
let toastT;function toast(h){const e=$('#toast');e.innerHTML=h;e.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.add('hidden'),4500)}

/* ---------- navigation & language ---------- */
function setView(v){
  if(v==='report'){openReport();return}
  state.view=v;$$('.view').forEach(s=>s.classList.toggle('active',s.id==='v-'+v));
  $$('.navbtn').forEach(b=>b.dataset.view===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  window.scrollTo({top:0});
}
function openReport(){renderReport();$('#printNote').classList.add('hidden');$('#report').classList.remove('hidden');document.body.style.overflow='hidden';$('#report').scrollTop=0;icons()}
function closeReport(){$('#report').classList.add('hidden');document.body.style.overflow=''}
function applyI18n(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $$('[data-i18n]').forEach(e=>{e.innerHTML=bidi(t(e.dataset.i18n))});
  $$('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  $$('.langbtn').forEach(b=>{const on=b.dataset.lang===lang;b.setAttribute('aria-pressed',on);b.className=`langbtn h-9 px-3 rounded-lg text-[13px] font-bold ${on?'grad-btn':'text-slate-400'}`});
  $('#scanBtnTxt').textContent=scanning?t('scanning'):t(state.scanned?'runAgain':'runScan');
  if(state.lastResult&&!scanning)$('#scanResult').textContent=t(state.lastResult);
}
function renderAll(){applyI18n();renderOverview();renderGraph();renderAssets();renderFindings();if(!$('#report').classList.contains('hidden'))renderReport();icons()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-id]');if(!b)return;
  if(b.dataset.view){setView(b.dataset.view);return}
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('rasid-lang',lang)}catch(x){}renderAll();return}
  if(b.dataset.af){state.af=b.dataset.af;renderAssets();return}
  if(b.id==='clearAF'){state.af='all';state.q='';$('#q').value='';renderAssets();return}
  if(b.dataset.sf){state.sf=b.dataset.sf;renderFindings();return}
  if(b.dataset.sevjump){state.sf=b.dataset.sevjump;renderFindings();setView('findings');return}
  if(b.dataset.fid){const f=FINDINGS.find(x=>x.id===b.dataset.fid);f.status=b.dataset.st;renderFindings();renderOverview();return}
  if(b.dataset.goto){state.sf='all';renderFindings();setView('findings');const c=$('#card-'+b.dataset.goto);if(c){c.scrollIntoView({block:'center'});c.classList.add('pulse');setTimeout(()=>c.classList.remove('pulse'),2100)}return}
  if(b.classList.contains('node')){state.sel=b.dataset.id;renderGraph();return}
});
$('#graph').addEventListener('keydown',e=>{const n=e.target.closest('.node');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.sel=n.dataset.id;renderGraph();const m=$(`.node[data-id="${state.sel}"]`);m&&m.focus()}});
$('#hlToggle').addEventListener('click',()=>{state.hl=!state.hl;renderGraph()});
$('#q').addEventListener('input',e=>{state.q=e.target.value;renderAssets()});
$('#scanBtn').addEventListener('click',runScan);$('#scanHead').addEventListener('click',runScan);$('#scanAgain').addEventListener('click',runScan);
$('#drawerClose').addEventListener('click',closeDrawer);$('#scrim').addEventListener('click',closeDrawer);
$('#repClose').addEventListener('click',closeReport);
$('#printBtn').addEventListener('click',()=>{try{window.print()}catch(x){}$('#printNote').classList.remove('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeReport()}});

renderAll();
}
</script>
</body>
</html>
